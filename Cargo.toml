[package]
name = "tracelab-server"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "tracelab-server"
path = "server/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"

# The runner parses every trace line as JSON; unoptimized serde_json reads slower than the worker writes,
# which stalled recording. Optimizing dependencies keeps debug builds of our own code.
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1
