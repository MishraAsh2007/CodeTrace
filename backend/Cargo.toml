[package]
name = "codetutor-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["cors"] }

[[bin]]
name = "codetutor-backend"
path = "src/main.rs"
