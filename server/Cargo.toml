[package]
name = "kiro-server"
version = "2.0.0"
edition = "2024"
description = "Rust API server for the CodeTrace Python Visualizer (tracing runs in Python via tracer.py)"
publish = false

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "io-util", "time", "sync", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "compression-gzip"] }

[profile.release]
opt-level = 3
codegen-units = 4
